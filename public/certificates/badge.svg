<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="EduChain certificate">
  <!-- The image a wallet shows for a certificate token. Deliberately generic: it carries no name and
       no serial, because the token metadata must contain no personal data. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="56" fill="#0B1020"/>
  <rect x="24" y="24" width="464" height="464" rx="40" fill="none" stroke="url(#g)" stroke-width="3"/>
  <circle cx="256" cy="206" r="78" fill="none" stroke="url(#g)" stroke-width="10"/>
  <path d="M216 206 l28 28 l54 -58" fill="none" stroke="url(#g)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M212 282 l-18 92 l62 -32 l62 32 l-18 -92" fill="none" stroke="url(#g)" stroke-width="10" stroke-linejoin="round"/>
  <text x="256" y="438" text-anchor="middle" font-family="DejaVu Sans, Outfit, sans-serif" font-size="30" letter-spacing="4" fill="#E8E9ED">EDUCHAIN</text>
  <text x="256" y="468" text-anchor="middle" font-family="DejaVu Sans, Outfit, sans-serif" font-size="17" letter-spacing="2" fill="#9BA1B4">CERTIFICATE · SOULBOUND</text>
</svg>
