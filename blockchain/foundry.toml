# Foundry fuzz + invariant layer, sharing the same contracts as the Hardhat suite.
# Hardhat remains the primary runner (unit/access/attacks/invariants in JS);
# Foundry adds property fuzzing (thousands of random inputs) + stateful invariants.
[profile.default]
src = "contracts"
out = "out-forge"
libs = ["node_modules", "lib"]
test = "test-forge"
cache_path = "cache-forge"
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/=node_modules/@openzeppelin/",
    "erc721a/=node_modules/erc721a/",
    "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 10000

[invariant]
runs = 256
depth = 50
fail_on_revert = false
